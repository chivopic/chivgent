name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Docker sandbox smoke test
        if: matrix.node-version == 22
        run: node scripts/docker-smoke.mjs

      - name: Eval preflight (no API calls)
        run: npm run eval -- --dry-run --allow-writes --allow-shell

      - name: Package dry run
        run: npm pack --dry-run

  desktop:
    runs-on: ubuntu-latest
    env:
      CHIVGENT_DESKTOP_ARTIFACT_DIR: ${{ github.workspace }}/apps/desktop/artifacts/desktop-e2e-failures
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Desktop dependencies
        run: npm --prefix apps/desktop ci

      - name: Desktop unit and integration tests
        run: npm run desktop:test

      - name: Build Electron app
        run: npm run desktop:build

      - name: Electron read-only end-to-end verification (offline fixture)
        run: xvfb-run -a node apps/desktop/scripts/verify-readonly.mjs

      - name: Electron history recovery end-to-end verification (offline fixture)
        run: xvfb-run -a node apps/desktop/scripts/verify-history.mjs

      - name: Upload Desktop E2E failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-e2e-diagnostics
          path: ${{ env.CHIVGENT_DESKTOP_ARTIFACT_DIR }}/
          if-no-files-found: ignore
          retention-days: 7
